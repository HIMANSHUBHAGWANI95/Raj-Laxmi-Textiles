  <text x="108" y="303" font-family="Helvetica, Arial, sans-serif" font-size="46" fill="#1A1614">A made bed in a Jaipuri printed sheet</text>
  <text x="108" y="424" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1A1614" fill-opacity="0.62">Bed fills the lower two-thirds, shot slightly above</text>
  <text x="108" y="487" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1A1614" fill-opacity="0.62">eye level, border panel running down the left of</text>
  <text x="108" y="550" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1A1614" fill-opacity="0.62">frame. Leave clear space top-left for the headline.</text>

  <text x="108" y="1242" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="#1A1614" fill-opacity="0.62">2400 x 1350 — 16:9 — PLACEHOLDER, NOT FINAL ARTWORK</text>
