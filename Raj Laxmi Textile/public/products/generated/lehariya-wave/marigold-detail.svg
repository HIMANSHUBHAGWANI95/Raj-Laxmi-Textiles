<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    
    <pattern id="d-field" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#DE9412"/>
      <rect width="5.04" height="36" fill="#B4760C"/>
      <rect x="16.56" width="2.52" height="36" fill="#FCFBF8" opacity="0.20"/>
    </pattern>
    
    <pattern id="d-threads" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.055"/>
      <rect width="1" height="4" fill="#FFFFFF" opacity="0.05"/>
    </pattern>

    <filter id="d-weave" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="28"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="d-cloth" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="14" flood-color="#1A1614" flood-opacity="0.26"/>
    </filter>

    <filter id="d-fold" x="-12%" y="-30%" width="130%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1614" flood-opacity="0.36"/>
    </filter>

    <filter id="d-ink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#d-field)"/>

