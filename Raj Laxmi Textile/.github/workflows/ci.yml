name: CI

on:
  push:
    branches: [main]
  pull_request:

# No deploy step here — Vercel owns deployment. See DEPLOY.md.
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run validate

      - name: Check image slots
        run: npm run check:images

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PROTOTYPE: "true"
